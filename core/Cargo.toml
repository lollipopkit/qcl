[package]
name = "qcl-core"
description = "Core library for QCL (Query Check Language)"
version = "0.1.3"
edition = "2024"
authors = ["lollipopkit <a@lpkit.cn>"]
license = "Apache-2.0"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
once_cell = { workspace = true }
chrono = { workspace = true, optional = true }

[features]
default = ["sem_arith", "json"]
# Semantic arith: 3 / 2 = 1.5, not 1
sem_arith = []
# Advanced arithmetic support: Map + Map, List + Val etc.
adv_arith = []
# Input format features
json = ["serde_json"]
yaml = ["serde_yaml"]
toml = ["dep:toml"]
# Standard library modules (Lua-inspired modular design)
stdlib-math = []
stdlib-string = []
stdlib-datetime = ["chrono"]
stdlib-os = []
stdlib-core = ["stdlib-math", "stdlib-string"]
stdlib-extended = ["stdlib-core", "stdlib-datetime"]
stdlib-all = ["stdlib-extended", "stdlib-os"]
all = ["sem_arith", "adv_arith", "json", "yaml", "toml", "stdlib-all"]

[dev-dependencies]
criterion = "0.3"

[[bench]]
name = "bench_main"
harness = false