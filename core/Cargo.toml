[package]
name = "qcl-core"
description = "Core library for QCL (Query Check Language)"
version = "0.2.0"
edition = "2024"
authors = ["lollipopkit <a@lpkit.cn>"]
license = "Apache-2.0"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
once_cell = { workspace = true }
chrono = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
crossbeam = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
rustc-hash = { version = "2", optional = true }
itoa = { version = "1", optional = true }
ryu = { version = "1", optional = true }
 

[features]
default = ["all"]
# Semantic arith: 3 / 2 = 1.5, not 1
sem_arith = []
# Advanced arithmetic support: Map + Map, List + Val etc.
adv_arith = []
# Faster hashmap for runtime maps and environments
fast_hash = ["dep:rustc-hash"]
# Faster number-to-string conversions for hot paths
fast_numconv = ["dep:itoa", "dep:ryu"]
# Input format features
json = ["serde_json"]
yaml = ["serde_yaml"]
toml = ["dep:toml"]
# Concurrency features
concurrency = ["tokio", "crossbeam", "futures"]
tokio-rt-multi-thread = ["concurrency", "tokio/rt-multi-thread"]
tokio-rt-current-thread = ["concurrency", "tokio/rt"]
# `vm`: enables the register bytecode VM subsystem
vm = []
# Optional compact 32-bit bytecode packing (scaffold)
bc32 = []
# `slots`: enables name resolution to slot indices
slots = []
all = [
    "sem_arith",
    "adv_arith",
    "json",
    "yaml",
    "toml",
    "concurrency",
    "vm",
    "slots",
    "bc32",
    # default performance features
    "fast_hash",
    "fast_numconv",
]

[dev-dependencies]
criterion = "0.3"

[[bench]]
name = "bench_main"
harness = false

[[bench]]
name = "slots_bench"
harness = false
