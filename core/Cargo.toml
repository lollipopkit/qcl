[package]
name = "qcl-core"
description = "Core library for QCL (Query Check Language)"
version = "0.2.0"
edition = "2024"
authors = ["lollipopkit <a@lpkit.cn>"]
license = "Apache-2.0"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
once_cell = { workspace = true }
chrono = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
crossbeam = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
 

[features]
default = ["all"]
# Semantic arith: 3 / 2 = 1.5, not 1
sem_arith = []
# Advanced arithmetic support: Map + Map, List + Val etc.
adv_arith = []
# Input format features
json = ["serde_json"]
yaml = ["serde_yaml"]
toml = ["dep:toml"]
# Concurrency features
concurrency = ["tokio", "crossbeam", "futures"]
tokio-rt-multi-thread = ["concurrency", "tokio/rt-multi-thread"]
tokio-rt-current-thread = ["concurrency", "tokio/rt"]
# `vm`: enables the register bytecode VM subsystem
vm = []
# `slots`: enables name resolution to slot indices
slots = []
all = ["sem_arith", "adv_arith", "json", "yaml", "toml", "concurrency", "vm", "slots"]

[dev-dependencies]
criterion = "0.3"

[[bench]]
name = "bench_main"
harness = false
