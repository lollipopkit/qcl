[package]
name = "qcl-stdlib"
description = "Standard library for QCL (Query Check Language)"
version = "0.1.3"
edition = "2024"
authors = ["lollipopkit <a@lpkit.cn>"]
license = "Apache-2.0"

[dependencies]
qcl-core = { path = "../core" }
anyhow = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, optional = true }

[features]
default = ["all"]
# Concurrency support
concurrency = ["tokio", "qcl-core/concurrency"]
# Keep a single umbrella feature for compatibility; all code is always built.
all = ["concurrency"]
