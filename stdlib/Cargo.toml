[package]
name = "qcl-stdlib"
description = "Standard library for QCL (Query Check Language)"
version = "0.1.3"
edition = "2024"
authors = ["lollipopkit <a@lpkit.cn>"]
license = "Apache-2.0"

[dependencies]
qcl-core = { path = "../core" }
anyhow = { workspace = true }
chrono = { workspace = true, optional = true }

[features]
default = ["stdlib-math", "stdlib-string"]
# Standard library modules (Lua-inspired modular design)
stdlib-math = []
stdlib-string = []
stdlib-datetime = ["chrono"]
stdlib-os = []
stdlib-core = ["stdlib-math", "stdlib-string"]
stdlib-extended = ["stdlib-core", "stdlib-datetime"]
stdlib-all = ["stdlib-extended", "stdlib-os"]