[package]
name = "qcl-stdlib"
description = "Standard library for QCL (Query Check Language)"
version = "0.1.3"
edition = "2024"
authors = ["lollipopkit <a@lpkit.cn>"]
license = "Apache-2.0"

[dependencies]
qcl-core = { path = "../core" }
anyhow = { workspace = true }
chrono = { workspace = true, optional = true }

[features]
default = ["all"]
all = ["stdlib-string", "stdlib-math", "stdlib-datetime", "stdlib-os", "stdlib-tcp"]
# Standard library modules
stdlib-math = []
stdlib-string = []
stdlib-datetime = ["chrono"]
stdlib-os = []
stdlib-tcp = []