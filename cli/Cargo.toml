[package]
name = "lkr-cli"
description = "CLI for LKR (Query Check Language)"
version = "0.1.3"
edition = "2024"
authors = ["lollipopkit <a@lpkit.cn>"]
license = "Apache-2.0"
default-run = "lkr"

[[bin]]
name = "lkr"
path = "src/main.rs"

[package.metadata.cargo-bin]
default-run = "lkr"

[dependencies]
lkr-core = { path = "../core" }
lkr-stdlib = { path = "../stdlib" }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
rustyline = "17"

[features]
default = ["all"]
concurrency = ["lkr-core/concurrency", "lkr-stdlib/concurrency"]
vm = ["lkr-core/vm"]
all = ["lkr-stdlib/all", "concurrency"]
