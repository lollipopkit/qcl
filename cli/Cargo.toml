[package]
name = "qcl-cli"
description = "CLI for QCL (Query Check Language)"
version = "0.1.3"
edition = "2024"
authors = ["lollipopkit <a@lpkit.cn>"]
license = "Apache-2.0"
default-run = "qcl"

[[bin]]
name = "qcl"
path = "src/main.rs"

[package.metadata.cargo-bin]
default-run = "qcl"

[dependencies]
qcl-core = { path = "../core" }
qcl-stdlib = { path = "../stdlib" }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }

[features]
default = ["all"]
concurrency = ["qcl-core/concurrency", "qcl-stdlib/concurrency"]
all = ["qcl-stdlib/all", "concurrency"]