[package]
name = "qcl-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
qcl = { path = "..", features = ["all"] }
serde_json = "1"

[[bin]]
name = "expr_parse"
path = "fuzz_targets/expr_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "expr_eval"
path = "fuzz_targets/expr_eval.rs"
test = false
doc = false
bench = false

[[bin]]
name = "de_formats"
path = "fuzz_targets/de_formats.rs"
test = false
doc = false
bench = false

[[bin]]
name = "deep_access"
path = "fuzz_targets/deep_access.rs"
test = false
doc = false
bench = false

[[bin]]
name = "in_operator"
path = "fuzz_targets/in_operator.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
