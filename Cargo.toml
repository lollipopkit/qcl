[package]
name = "qcl"
description = "A Query Check Language written in Rust"
version = "0.1.3"
edition = "2024"
authors = ["lollipopkit <a@lpkt.cn>"]
license = "Apache-2.0"
repository = "https://github.com/lollipopkit/qcl"

[package.metadata.cargo-test]
args = ["--", "--nocapture"]

[dependencies]
anyhow = "^1"
serde = { version = "^1", features = ["derive"] }
serde_json = { version = "^1", optional = true }
serde_yaml = { version = "^0.9", optional = true }
toml = { version = "^0.8", optional = true }
once_cell = "1"

[features]
default = ["sem_arith", "json"]
# Semantic arith: 3 / 2 = 1.5, not 1
sem_arith = []
# Advanced arithmetic support: Map + Map, List + Val etc.
adv_arith = []
# Input format features
json = ["serde_json"]
yaml = ["serde_yaml"]
toml = ["dep:toml"]
all = ["sem_arith", "adv_arith", "json", "yaml", "toml"]

[dev-dependencies]
criterion = "0.3"

[[bench]]
name = "bench_main"
harness = false
