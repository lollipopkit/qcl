[workspace]
members = ["core", "cli", "stdlib"]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2024"
authors = ["lollipopkit <a@lpkit.cn>"]
license = "Apache-2.0"
repository = "https://github.com/lollipopkit/qcl"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0"
toml = "0"
once_cell = "1"
chrono = "0"
criterion = "0"
sanitize-filename = "0"
