[package]
name = "qcl-lsp"
version = "0.1.0"
edition = "2021"
description = "Language Server Protocol implementation for QCL"

[[bin]]
name = "qcl-lsp"
path = "src/main.rs"

[dependencies]
qcl-core = { path = "../core" }
qcl-stdlib = { path = "../stdlib" }
tower-lsp = "0.20"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
regex = "1.0"
url = "2.0"
anyhow = "1.0"
dashmap = "5"
ropey = "1"
twox-hash = "1"

[features]
default = ["all"]
all = ["qcl-stdlib/all"]
